services:
  # Telegram bot
  bot:
    build: .
    container_name: eslatbot_bot
    command: python main.py
    env_file: .env
    environment:
      DB_NAME: data/eslatbot.db
    volumes:
      - bot_data:/app/data
    restart: unless-stopped

  # Django admin panel (gunicorn)
  adminka:
    build: .
    container_name: eslatbot_adminka
    command: sh -c "python root/manage.py migrate --noinput && python root/manage.py collectstatic --noinput && (python root/manage.py createsuperuser --noinput || true) && gunicorn --chdir root config.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    env_file: .env
    environment:
      DB_NAME: data/eslatbot.db
      DJANGO_DEBUG: "0"
    # Faqat localhost'dan: serverda tashqi nginx shu portga proxy qiladi
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8001}:8000"
    volumes:
      - bot_data:/app/data
      - static_files:/app/root/staticfiles
    restart: unless-stopped

  # Caddy — tashqi kirish nuqtasi. Domen berilsa HTTPS avtomatik!
  # Faqat 80/443 bo'sh serverlarda: .env da COMPOSE_PROFILES=caddy
  # Serverda boshqa nginx bo'lsa — kerak emas (u o'zi proxy qiladi).
  caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    container_name: eslatbot_caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      # .env da DOMAIN=eslat.thesofmebel.uz bo'lsa — avto-HTTPS,
      # bo'lmasa lokalda oddiy http://localhost
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - static_files:/static:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - adminka
    restart: unless-stopped

volumes:
  bot_data:      # SQLite baza — konteyner o'chsa ham saqlanadi
  static_files:  # Django admin static fayllari
  caddy_data:    # HTTPS sertifikatlar
  caddy_config:
